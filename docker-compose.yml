# Ambiente de teste local do Whaticket (Postgres + Redis).
# Portas de host deslocadas (5433 / 6380) para não colidir com serviços
# já rodando em 5432 / 6379 nesta máquina.
services:
  db:
    image: postgres:16-alpine
    container_name: whaticket_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: whaticket
      POSTGRES_PASSWORD: whaticket
      POSTGRES_DB: whaticket
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - whaticket_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaticket -d whaticket"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: whaticket_test_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6380:6379"
    volumes:
      - whaticket_test_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whaticket_test_pgdata:
  whaticket_test_redisdata:
